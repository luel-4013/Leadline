services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app/app
      - db_data:/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/leadline.db
      - DEBUG=false
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./ui:/app
      - node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - API_PROXY_TARGET=http://backend:8000
    # Bind inside the container; the host mapping above is loopback-only.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  node_modules:
